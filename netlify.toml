# BONZINILABS LTD — Netlify configuration
# Static site, no build step: the repository root is published as-is.

[build]
  publish = "."
  command = ""

# The site must stay publicly reachable — no password, no basic auth, no
# "coming soon" gate. Stripe's reviewers have to open it directly.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The site loads nothing from anywhere else. 'unsafe-inline' covers exactly
    # two inline blocks — the JSON-LD entity data and the footer year — and the
    # page renders no user input, so there is nothing for it to smuggle.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# Fonts and images never change without changing name; the stylesheet and the
# script do, and their filenames are not content-hashed, so an immutable cache
# would strand returning visitors on an old build.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Development files live in the repository but must not be reachable on the
# public site: the domain should serve the company's pages and nothing else.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/img/og-image.svg"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/404.html"
  status = 404
  force = true
